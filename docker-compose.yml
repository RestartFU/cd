version: '3.8'

services:
  cd-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cd-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount config file
      - ./config.toml:/app/config.toml:ro
      # Optional: Mount logs directory
      - ./logs:/app/logs
    environment:
      # Optional environment variables
      - LOG_LEVEL=info
      - SERVER_PORT=8080
    networks:
      - cd-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cd-server.rule=Host(`cd-server.localhost`)"
      - "traefik.http.services.cd-server.loadbalancer.server.port=8080"

  # Optional: Redis for caching (if needed in future)
  redis:
    image: redis:7-alpine
    container_name: cd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cd-network
    command: redis-server --appendonly yes
    profiles:
      - cache

  # Optional: PostgreSQL for deployment history (if needed in future)
  postgres:
    image: postgres:15-alpine
    container_name: cd-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cd_tool
      POSTGRES_USER: cd_user
      POSTGRES_PASSWORD: cd_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cd-network
    profiles:
      - database

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: cd-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cd-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: cd-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - cd-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

networks:
  cd-network:
    driver: bridge
    name: cd-network

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# Usage Examples:
#
# Basic setup (CD server only):
#   docker-compose up -d
#
# With caching (Redis):
#   docker-compose --profile cache up -d
#
# With database (PostgreSQL):
#   docker-compose --profile database up -d
#
# With monitoring (Prometheus + Grafana):
#   docker-compose --profile monitoring up -d
#
# Full stack:
#   docker-compose --profile cache --profile database --profile monitoring up -d
#
# Build and run:
#   docker-compose up --build -d
#
# View logs:
#   docker-compose logs -f cd-server
#
# Stop services:
#   docker-compose down
#
# Remove volumes (careful!):
#   docker-compose down -v
