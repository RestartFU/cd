# Simple Deployment Workflow with Environment Variables Support
# Copy this file to .github/workflows/deploy.yml in your repository

name: Deploy Application

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - development
      include_secrets:
        description: "Include all GitHub secrets as environment variables"
        required: false
        default: true
        type: boolean
      custom_env_vars:
        description: "Custom environment variables (KEY=VALUE,KEY2=VALUE2)"
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to CD Server
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ inputs.environment || 'production' }}
      timeout: 15
      env_file: ".env" # Load environment variables from .env file if it exists
      env_vars: ${{ inputs.custom_env_vars }}
      include_github_secrets: ${{ inputs.include_secrets }}
    secrets:
      CD_SERVER_HOST: ${{ secrets.CD_SERVER_HOST }}
      CD_API_KEY: ${{ secrets.CD_API_KEY }}

  post-deploy:
    name: Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Notify team
        run: |
          echo "🚀 Deployment completed successfully!"
          echo "Environment: ${{ inputs.environment || 'production' }}"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Custom env vars: ${{ inputs.custom_env_vars != '' && 'Yes' || 'No' }}"
          echo "GitHub secrets included: ${{ inputs.include_secrets }}"

      - name: Update deployment status
        run: |
          # Add your post-deployment tasks here
          # Examples:
          # - Update monitoring dashboards
          # - Send Slack notifications
          # - Update deployment tracking systems
          # - Run smoke tests
          # - Update environment-specific configurations
          echo "✅ Post-deployment tasks completed"

      - name: Environment-specific tasks
        if: inputs.environment == 'production'
        run: |
          echo "🏭 Running production-specific tasks..."
          # Production-only tasks:
          # - Clear CDN cache
          # - Warm up application
          # - Send production deployment notifications
          echo "✅ Production tasks completed"
