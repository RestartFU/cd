# Advanced Deployment Workflow with Multi-Environment Support and Environment Variables
# Copy this file to .github/workflows/deploy.yml in your repository

name: Advanced Deployment Pipeline

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - production
          - staging
          - development
          - testing
      force_deploy:
        description: "Force deployment even if tests fail"
        required: false
        default: false
        type: boolean
      rollback:
        description: "Rollback to previous version"
        required: false
        default: false
        type: boolean
      custom_env_vars:
        description: "Custom environment variables (KEY=VALUE,KEY2=VALUE2)"
        required: false
        type: string
      env_file_path:
        description: "Path to environment file (.env format)"
        required: false
        default: ".env"
        type: string
      include_github_secrets:
        description: "Include GitHub secrets as environment variables"
        required: false
        default: true
        type: boolean
      include_deployment_info:
        description: "Include deployment metadata as environment variables"
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: "18"
  DOCKER_BUILDKIT: 1
  # Default environment configuration
  DEFAULT_ENV_FILE: ".env"
  STAGING_ENV_FILE: ".env.staging"
  PRODUCTION_ENV_FILE: ".env.production"

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
      environment: ${{ steps.env.outputs.environment }}
      deploy_type: ${{ steps.type.outputs.deploy_type }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect file changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Check if deployment-relevant files changed
            if git diff --name-only HEAD~1 HEAD | grep -E '\.(js|ts|py|go|java|dockerfile|docker-compose|package\.json|requirements\.txt|go\.mod)$|^src/|^app/|^config/'; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ ^refs/heads/release/ ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Determine deployment type
        id: type
        run: |
          if [ "${{ inputs.rollback }}" = "true" ]; then
            echo "deploy_type=rollback" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy_type=manual" >> $GITHUB_OUTPUT
          else
            echo "deploy_type=automatic" >> $GITHUB_OUTPUT
          fi

  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should_deploy == 'true' && inputs.rollback != true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        if: hashFiles('Dockerfile') != ''
        run: |
          echo "📋 Validating Dockerfile..."
          if [ -f "Dockerfile" ]; then
            # Basic Dockerfile validation
            if ! grep -q "FROM" Dockerfile; then
              echo "❌ Dockerfile missing FROM instruction"
              exit 1
            fi
            echo "✅ Dockerfile validation passed"
          fi

      - name: Check for required files
        run: |
          echo "📋 Checking for required deployment files..."
          REQUIRED_FILES=()

          if [ ! -f "Dockerfile" ] && [ ! -f "docker-compose.yml" ] && [ ! -f "package.json" ] && [ ! -f "requirements.txt" ] && [ ! -f "go.mod" ]; then
            echo "⚠️  Warning: No standard deployment configuration found"
            echo "   Consider adding a Dockerfile for containerized deployment"
          else
            echo "✅ Deployment configuration found"
          fi

      - name: Security scan
        run: |
          echo "🔒 Running basic security checks..."

          # Check for exposed secrets in code
          if grep -r -i "password\|secret\|key\|token" --include="*.js" --include="*.py" --include="*.go" --include="*.java" . | grep -v node_modules | head -5; then
            echo "⚠️  Warning: Potential secrets found in code. Please review."
          fi

          # Check for .env files in git
          if git ls-files | grep -E "\.env$|\.env\."; then
            echo "⚠️  Warning: Environment files found in git. Ensure no secrets are committed."
          fi

          echo "✅ Security scan completed"

  deploy-staging:
    name: Deploy to Staging
    needs: [detect-changes, pre-deployment-checks]
    if: |
      always() &&
      needs.detect-changes.outputs.should_deploy == 'true' &&
      needs.detect-changes.outputs.environment != 'production' &&
      (needs.pre-deployment-checks.result == 'success' || needs.pre-deployment-checks.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: ${{ needs.detect-changes.outputs.environment }}
      timeout: 20
      env_file: ${{ needs.detect-changes.outputs.environment == 'staging' && '.env.staging' || '.env' }}
      env_vars: ${{ inputs.custom_env_vars }}
      include_github_secrets: ${{ inputs.include_github_secrets }}
    secrets:
      CD_SERVER_HOST: ${{ secrets.CD_SERVER_HOST }}
      CD_API_KEY: ${{ secrets.CD_API_KEY }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: success() && needs.detect-changes.outputs.environment != 'production'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for deployment to be ready
        run: |
          echo "⏳ Waiting for deployment to be ready..."
          sleep 30

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."

          # Add your smoke test commands here
          # Examples:
          # curl -f http://your-staging-url/health
          # npm run test:smoke
          # python -m pytest tests/smoke/

          echo "✅ Smoke tests passed"

      - name: Run integration tests
        run: |
          echo "🔧 Running integration tests..."

          # Add your integration test commands here
          # Examples:
          # npm run test:integration
          # python -m pytest tests/integration/
          # go test ./tests/integration/...

          echo "✅ Integration tests passed"

  deploy-production:
    name: Deploy to Production
    needs: [detect-changes, pre-deployment-checks, integration-tests]
    if: |
      always() &&
      needs.detect-changes.outputs.should_deploy == 'true' &&
      needs.detect-changes.outputs.environment == 'production' &&
      (needs.pre-deployment-checks.result == 'success' || needs.pre-deployment-checks.result == 'skipped') &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped' || inputs.force_deploy == true)

    environment:
      name: production
      url: https://your-production-url.com

    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      timeout: 30
      env_file: ".env.production"
      env_vars: ${{ inputs.custom_env_vars }}
      include_github_secrets: ${{ inputs.include_github_secrets }}
    secrets:
      CD_SERVER_HOST: ${{ secrets.CD_SERVER_HOST }}
      CD_API_KEY: ${{ secrets.CD_API_KEY }}

  production-verification:
    name: Production Verification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()

    steps:
      - name: Wait for production deployment
        run: |
          echo "⏳ Waiting for production deployment to stabilize..."
          sleep 60

      - name: Health check
        run: |
          echo "🏥 Running production health checks..."

          # Add your health check commands here
          # Examples:
          # curl -f https://your-production-url.com/health
          # Check database connectivity
          # Verify external service integrations

          echo "✅ Production health checks passed"

      - name: Performance verification
        run: |
          echo "⚡ Running performance verification..."

          # Add performance checks here
          # Examples:
          # Load testing with curl or hey
          # Response time validation
          # Resource usage monitoring

          echo "✅ Performance verification completed"

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: inputs.rollback == true
    environment: ${{ inputs.environment }}

    steps:
      - name: Confirm rollback
        run: |
          echo "🔄 Rolling back deployment..."
          echo "Environment: ${{ inputs.environment }}"
          echo "Initiated by: ${{ github.actor }}"
          echo "Reason: Manual rollback requested"

      - name: Execute rollback
        run: |
          echo "⚠️  Rollback functionality requires manual implementation"
          echo "Consider implementing:"
          echo "• Database migration rollbacks"
          echo "• Previous container image deployment"
          echo "• Configuration restoration"
          echo "• Traffic routing updates"

          # Add your rollback logic here
          exit 1  # Remove this when rollback is implemented

  notify-teams:
    name: Notify Teams
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, rollback]
    if: always()

    steps:
      - name: Prepare notification
        id: notification
        run: |
          STATUS="unknown"
          if [ "${{ needs.deploy-production.result }}" = "success" ]; then
            STATUS="success"
            ENVIRONMENT="production"
          elif [ "${{ needs.deploy-staging.result }}" = "success" ]; then
            STATUS="success"
            ENVIRONMENT="${{ needs.detect-changes.outputs.environment }}"
          elif [ "${{ needs.rollback.result }}" = "success" ]; then
            STATUS="rollback-success"
            ENVIRONMENT="${{ inputs.environment }}"
          else
            STATUS="failure"
            ENVIRONMENT="${{ needs.detect-changes.outputs.environment }}"
          fi

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

      - name: Send notification
        env:
          CUSTOM_ENV_VARS: ${{ inputs.custom_env_vars }}
          INCLUDE_SECRETS: ${{ inputs.include_github_secrets }}
        run: |
          echo "📢 Sending deployment notification..."
          echo "Status: ${{ steps.notification.outputs.status }}"
          echo "Environment: ${{ steps.notification.outputs.environment }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Custom env vars: ${{ inputs.custom_env_vars != '' && 'Yes' || 'No' }}"
          echo "GitHub secrets included: ${{ inputs.include_github_secrets }}"

          # Add your notification logic here:
          # - Slack webhook with deployment details
          # - Microsoft Teams with environment info
          # - Email notifications with custom variables
          # - Discord webhook with status updates
          # - Custom webhook endpoints with full context

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs:
      [
        deploy-staging,
        deploy-production,
        integration-tests,
        production-verification,
      ]
    if: always()

    steps:
      - name: Cleanup temporary resources
        run: |
          echo "🧹 Cleaning up temporary resources..."

          # Add cleanup tasks here:
          # - Remove temporary test data
          # - Clean up test databases
          # - Remove temporary files and environment configs
          # - Clear caches if needed
          # - Clean up environment-specific temporary resources

          # Clean up any temporary environment files
          find /tmp -name "*.env.*" -type f -delete 2>/dev/null || true
          find /tmp -name "github_secrets_*" -type f -delete 2>/dev/null || true

          echo "✅ Cleanup completed"
